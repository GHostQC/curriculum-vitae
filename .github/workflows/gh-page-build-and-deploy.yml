name: Build LaTeX PDFs and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same image as local builds; pulling it takes minutes vs ~1h for apt texlive-full
      - name: Build PDFs
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/w" -w /w \
            texlive/texlive:latest make all

      - name: Create deployment files
        run: |
          mkdir -p _deploy
          cp index.html _deploy/
          cp *.pdf _deploy/
          cp .nojekyll _deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
